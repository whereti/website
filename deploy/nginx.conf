server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind a proxy, redirects must not carry the container's host and port.
    absolute_redirect off;

    include /etc/nginx/security-headers.conf;

    # Every page is a folder holding an index.html.
    location / {
        try_files $uri $uri/ =404;
    }

    # The download page became a section of the home page; the installer's
    # entry in Windows Settings, Apps still links to /download/.
    location ~ ^/download/?$ {
        return 301 /#download;
    }

    error_page 404 /404.html;

    # Astro fingerprints these file names, so they can be cached for good.
    location /_astro/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Images keep their names across releases: a short life.
    location ~* \.(png|svg|ico|webp|jpg|woff2)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
    }

    # Pages never: a cached page would keep offering an old version.
    location ~* \.html$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    server_tokens off;

    # No access log, so ordinary visits leave no IP address here.
    access_log off;
}
